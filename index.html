  <body>
    <div id="root"></div>
    <noscript>
      <div lang="en">
        <h1>ANT - Ant Colony Intelligence Laboratory</h1>
        <p>
          A reproducible educational simulation of ant-colony foraging. Ants follow a few local
          rules — sensing the chemical field, depositing and following food pheromone trails — and
          the collective pattern emerges from those local choices.
        </p>
        <ul>
          <li>One reproducible experiment: play, pause, step, reset and follow a single ant.</li>
          <li>
            Three guided exercises: read the first trail, change one parameter, follow one ant.
          </li>
          <li>
            Run replay: versions, configuration, tick count, metrics and events are exported and
            re-simulated.
          </li>
          <li>
            Model assumptions and evidence, labelled as simulated, calculated and user-supplied.
          </li>
        </ul>
        <p>
          This is an educational agent model, not a validated reconstruction of a species. Ticks,
          distance, food and chemical values are abstract and not species-calibrated; the numbers
          shown are model outputs, not biological measurements, and a bright trail does not prove a
          shortest path.
        </p>
        <p>The interactive simulation itself requires JavaScript.</p>
      </div>
    </noscript>
