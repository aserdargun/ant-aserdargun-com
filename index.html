      <div lang="en">
        <h1>ANT - Ant Colony Intelligence Laboratory</h1>
        <p>
          A reproducible educational simulation of ant-colony foraging. Ants follow a few local
          rules — sensing the chemical field, depositing and following food pheromone trails — and
          the collective pattern emerges from those local choices.
        </p>
        <ul>
          <li>One reproducible experiment: play, pause, step, reset and follow a single ant.</li>
          <li>
            Three guided exercises: read the first trail, change one parameter, follow one ant.
          </li>
          <li>
            Run replay: versions, configuration, tick count, metrics and events are exported and
            re-simulated.
          </li>
          <li>
            Model assumptions and evidence, labelled as simulated, calculated and user-supplied.
          </li>
        </ul>
        <p>
          This is an educational agent model, not a validated reconstruction of a species. Ticks,
          distance, food and chemical values are abstract and not species-calibrated; the numbers
          shown are model outputs, not biological measurements, and a bright trail does not prove a
          shortest path.
        </p>
        <p>
          <strong>Research review: 2026-09-06.</strong> Publisher metadata and the available
          abstract/preview of Deneubourg et al. (1990) and Goss et al. (1989) were checked on that
          date. Subscription-only full text was not used to derive this implementation.
        </p>
        <p>
          <strong>Scope, chosen on purpose:</strong> one published experiment and three guided
          studies. Queued next: EXP-002–010, synchronized A/B comparison and sandbox editing.
        </p>
        <p>
          <strong>Sibling lab:</strong> BEE reads the same two-paper family through a different
          communication mechanism. No comparative numbers are published here.
          <a href="https://bee.aserdargun.com/">bee.aserdargun.com</a>
        </p>
        <p lang="tr">
          <strong lang="tr">Araştırma incelemesi: 2026-09-06.</strong> Deneubourg vd. (1990) ve Goss
          vd. (1989) yayıncı üst verileri ile erişilebilen özet/önizleme bu tarihte kontrol edildi;
          abonelikle erişilen tam metin kullanılmadı.
          <strong lang="tr">Kapsam, bilinçli bir seçim:</strong> bir yayımlanmış deney ve üç
          rehberli çalışma. Sırada: EXP-002–010, eşzamanlı A/B karşılaştırması ve sandbox.
          <strong lang="tr">Kardeş laboratuvar:</strong> BEE aynı iki makale ailesini farklı bir
          iletişim mekanizması üzerinden okur.
        </p>
        <p>The interactive simulation itself requires JavaScript.</p>
